<!doctype html>
<html lang="en-IE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f5efd9" />
    <meta name="robots" content="noindex" />
    <title>Leave a review | Happy Sheep Dublin</title>
    <meta
      name="description"
      content="Thanks for coming in to Happy Sheep Dublin. Pick your café and leave us a Google review."
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/assets/fonts/dm-sans-latin.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/assets/fonts/dm-serif-display-italic-latin.woff2"
      crossorigin
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="review-page">
    <main class="review-main">
      <picture>
        <source
          type="image/webp"
          srcset="/assets/logo-clear.webp 1x, /assets/logo-clear@2x.webp 2x"
        />
        <img
          class="review-logo"
          src="/assets/logo-clear.png"
          srcset="/assets/logo-clear.png 1x, /assets/logo-clear@2x.png 2x"
          width="150"
          height="150"
          alt="Happy Sheep Dublin"
        />
      </picture>
      <h1>Thanks for coming in!</h1>
      <p>Which café were you in?</p>
      <div class="review-choices">
        <!-- @review-buttons -->
      </div>
      <a class="review-back" href="/">Back to the website</a>
    </main>
  </body>
</html>
